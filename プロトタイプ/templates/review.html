<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レビューを投稿</title>
    <link rel="stylesheet" href="../static/review.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <a class="back-link" href="top-index.html">← 戻る</a>
            <a class="brand" href="top-index.html">Re:Tailor</a>
            <span class="header-space" aria-hidden="true"></span>
        </header>

        <main class="content">
            <p class="eyebrow">購入ありがとうございました</p>
            <h1>レビューを投稿</h1>
            <p class="lead">受け取った商品の感想を、次の人へ届けましょう。</p>

            <section class="product-card" aria-label="レビュー対象の商品">
                <div class="product-image" aria-label="シンプルブラックTシャツの商品画像">商品画像</div>
                <div>
                    <p class="product-label">購入した商品</p>
                    <h2>シンプルブラックTシャツ</h2>
                    <p class="seller">出品者：Style Market</p>
                </div>
            </section>

            <form id="reviewForm" novalidate>
                <fieldset class="rating-field" aria-describedby="ratingError">
                    <legend>商品の満足度 <span class="required">必須</span></legend>
                    <div class="stars" role="radiogroup" aria-label="星の数">
                        <label><input type="radio" name="rating" value="1"><span aria-hidden="true">★</span><b>1</b></label>
                        <label><input type="radio" name="rating" value="2"><span aria-hidden="true">★</span><b>2</b></label>
                        <label><input type="radio" name="rating" value="3"><span aria-hidden="true">★</span><b>3</b></label>
                        <label><input type="radio" name="rating" value="4"><span aria-hidden="true">★</span><b>4</b></label>
                        <label><input type="radio" name="rating" value="5"><span aria-hidden="true">★</span><b>5</b></label>
                    </div>
                    <p class="field-error" id="ratingError"></p>
                </fieldset>

                <div class="field">
                    <label for="comment">レビュー本文 <span class="required">必須</span></label>
                    <textarea id="comment" name="comment" maxlength="300" placeholder="商品の状態や取引について教えてください。"></textarea>
                    <div class="field-meta"><span id="commentError" class="field-error"></span><span id="counter">0 / 300</span></div>
                </div>

                <label class="check-row"><input type="checkbox" name="again"><span>また利用したいと思う</span></label>
                <p class="privacy">レビューは商品ページに公開されます。個人情報は入力しないでください。</p>
                <button class="submit-button" type="submit">レビューを投稿する</button>
                <p class="form-status" id="formStatus" role="status"></p>
            </form>
        </main>
    </div>
    <script src="../static/review.js"></script>
</body>
</html>
