<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイクローゼット | Re:Tailor</title>
  <link rel="stylesheet" href="../static/my-closet.css">
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="top-index.html" aria-label="トップページへ戻る">←</a>
    <a class="brand" href="top-index.html">Re:Tailor</a>
    <a class="nav-link" href="coordinate_shindan.html">コーデ診断</a>
  </header>
  <main class="page-shell">
    <div class="heading"><p class="eyebrow">MY CLOSET</p><h1>マイクローゼット</h1><p>自分が持っている服や小物を登録して、購入を迷っている商品との相性を診断できます。</p></div>
    <section class="panel">
      <div class="section-heading"><h2>アイテムを登録</h2><span class="required">必須項目あり</span></div>
      <form id="closetForm" novalidate>
        <div class="field"><label for="itemName">商品名 <b>必須</b></label><input id="itemName" name="name" type="text" placeholder="例：お気に入りの白シャツ" required></div>
        <div class="field"><label for="itemImage">商品写真 <span>任意</span></label><input id="itemImage" name="imageFile" type="file" accept="image/*"><p class="field-note">JPG・PNG・WEBPなどの画像を1枚登録できます。</p></div>
        <div class="field"><label for="category">商品カテゴリ <b>必須</b></label><select id="category" name="category"><option value="tops">トップス</option><option value="bottoms">ボトムス</option><option value="outer">アウター</option><option value="shoes">靴</option><option value="accessories">アクセサリー</option></select></div>
        <div id="categoryFields"></div>
        <p class="form-error" id="formError" role="alert"></p>
        <button class="primary-button" type="submit">クローゼットに登録する</button>
      </form>
    </section>
    <section class="panel closet-panel"><div class="section-heading"><h2>登録済みアイテム</h2><span id="itemCount">0件</span></div><div id="closetList" class="closet-list"></div><p id="emptyMessage" class="empty">まだアイテムが登録されていません。</p><a class="diagnosis-link" href="coordinate_shindan.html">登録アイテムでコーディネート診断を見る →</a></section>
  </main>
  <script src="../static/my-closet.js"></script>
</body>
</html>
