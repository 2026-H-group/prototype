<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | Re:Tailor</title>
    <link rel="stylesheet" href="../static/login.css">
    <link rel="stylesheet" href="../static/common-base.css">
</head>

<body>
    <a class="rt-skip-link" href="#loginForm">ログインフォームへ移動</a>

    <main class="container">
        <div class="box">
            <h1 class="logo"><a href="top-index.html">Re:Tailor</a></h1>

            <h2 class="welcome">おかえりなさい!</h2>
            <p class="description">アカウントにアクセスするには、ログイン情報を入力してください。</p>

            <form id="loginForm" novalidate>
                <!-- メールアドレス -->
                <div class="input-group">
                    <label for="email">メールアドレス</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        inputmode="email"
                        placeholder="example@mail.com"
                        aria-describedby="loginError"
                    >
                </div>

                <!-- パスワード -->
                <div class="input-group">
                    <div class="password-label">
                        <label for="password">パスワード</label>
                        <a href="help.html" class="forgot">パスワードを忘れた場合</a>
                    </div>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="パスワードを入力"
                        aria-describedby="loginError"
                    >
                </div>

                <!-- ログイン状態を保持 -->
                <div class="remember">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">30日間ログイン状態を保持する</label>
                </div>

                <!-- ログイン（主ボタン） -->
                <button type="submit" class="button">ログイン</button>
                <p id="loginError" class="field-error" role="alert"></p>

                <div class="or">または</div>

                <!-- Google / Apple（プロトタイプでは未対応。押すと案内を表示する） -->
                <div class="social-login">
                    <button type="button" class="social-button" data-social="Google">
                        <img src="../image/google-logo.png" alt="" width="18" height="18">
                        Googleでログイン
                    </button>
                    <button type="button" class="social-button" data-social="Apple">
                        <img src="../image/apple-logo.jpg" alt="" width="18" height="18">
                        Appleでログイン
                    </button>
                </div>
                <p id="socialNote" class="field-note" role="status" aria-live="polite"></p>

                <!-- 新規登録 -->
                <div class="login">
                    アカウントをお持ちでない方は
                    <a href="signup.html">新規登録</a>
                </div>
            </form>
        </div>
    </main>

    <script src="../static/auth.js"></script>
</body>
</html>
