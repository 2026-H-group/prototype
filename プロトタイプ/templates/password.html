<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード変更 | Re:Tailor</title>
  <link rel="stylesheet" href="../static/member-profile.css">
</head>
<body>
  <main class="placeholder-page">
    <a href="./member-profile.html">← 会員情報へ戻る</a>
    <h1>パスワード変更</h1>
    <form id="passwordForm">
      <p>
        <label class="field-label" for="currentPassword">現在のパスワード</label>
        <input class="control" id="currentPassword" type="password" autocomplete="current-password">
      </p>
      <p>
        <label class="field-label" for="newPassword">新しいパスワード</label>
        <input class="control" id="newPassword" type="password" autocomplete="new-password">
      </p>
      <p>
        <label class="field-label" for="confirmPassword">新しいパスワード（確認）</label>
        <input class="control" id="confirmPassword" type="password" autocomplete="new-password">
      </p>
      <p id="passwordMessage"></p>
      <button class="dialog-ok" type="submit">パスワードを更新</button>
    </form>
  </main>
  <script src="../static/api.js"></script>
  <script>
    document.getElementById("passwordForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const result = await window.RetailorApi.changePassword({
        currentPassword: document.getElementById("currentPassword").value,
        newPassword: document.getElementById("newPassword").value,
        confirmPassword: document.getElementById("confirmPassword").value,
      });
      const message = document.getElementById("passwordMessage");
      message.textContent = result.error ? result.error.message : "パスワードを更新しました。（モック）";
      message.style.color = result.error ? "var(--rt-danger)" : "var(--rt-success)";
    });
  </script>
</body>
</html>
