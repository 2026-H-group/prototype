<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワードを忘れた場合 - Re:Tailor</title>
    <link rel="stylesheet" href="../static/login.css">
</head>
<body>
    <div class="container">
        <div class="box">
            <h1 class="logo">Re:Tailor</h1>
            <h2 class="welcome">パスワードをお忘れですか？</h2>
            <p class="description">
                ご登録のメールアドレスを入力してください。パスワード再設定の案内をお送りします。
            </p>

            <form id="forgotPasswordForm" novalidate>
                <div class="input-group">
                    <label for="forgotEmail">Emailアドレス</label>
                    <input
                        type="email"
                        id="forgotEmail"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <button type="submit" class="button">再設定用メールを送信</button>
                <p id="forgotPasswordMessage" class="form-message" role="status" aria-live="polite"></p>
            </form>

            <div class="login">
                <a href="login.html">ログイン画面に戻る</a>
            </div>
        </div>
    </div>

    <script src="../static/auth.js"></script>
</body>
</html>
