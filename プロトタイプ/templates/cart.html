<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カート一覧 | Re:Tailor</title>
  <link rel="stylesheet" href="../static/cart.css">
  <link rel="stylesheet" href="../static/common-base.css">
  <link rel="stylesheet" href="../static/common-footer.css">
  <script src="../static/common-footer.js" defer></script>
</head>
<body>
  <a class="rt-skip-link" href="#main">本文へ移動</a>
  <header class="topbar">
    <a href="top-index.html" class="back-link" aria-label="トップページへ戻る">←</a>
    <a href="top-index.html" class="brand">Re:Tailor</a>
    <a href="my-page.html" class="account-link">マイページ</a>
  </header>
  <main id="main" class="page-shell">
    <p class="eyebrow">SHOPPING CART</p>
    <h1>カート一覧</h1>
    <p class="lead">購入する商品を選択してください。</p>

    <div class="cart-toolbar" id="cartToolbar">
      <label class="select-all"><input type="checkbox" id="selectAll">すべて選択</label>
      <span id="cartCount" class="cart-count" role="status"></span>
    </div>

    <div id="cartList" class="cart-list"></div>

    <div id="emptyCart" class="empty" hidden>
      <p>カートに商品がありません。</p>
      <a class="empty-link" href="search.html">商品を探す</a>
    </div>

    <section id="cartSummary" class="cart-summary" aria-label="お会計">
      <span id="selectedCount">0商品を選択中</span>
      <strong id="selectedTotal">¥0</strong>
      <p class="note">送料は、次の画面で配送方法を選ぶと加算されます。</p>
      <button id="checkoutButton" type="button">選択した商品を購入する →</button>
      <p id="cartError" class="error" role="alert"></p>
    </section>
  </main>
  <script src="../static/product-data.js"></script>
  <script src="../static/cart.js"></script>
</body>
</html>
