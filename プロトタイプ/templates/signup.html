<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 | Re:Tailor</title>
    <link rel="stylesheet" href="../static/login.css">
    <link rel="stylesheet" href="../static/common-base.css">
</head>

<body>
    <a class="rt-skip-link" href="#signupForm">登録フォームへ移動</a>

    <main class="container">
        <div class="box">
            <h1 class="logo"><a href="top-index.html">Re:Tailor</a></h1>

            <h2 class="welcome">アカウントを作成</h2>
            <p class="description">情報を入力してアカウントを作成してください。</p>

            <form id="signupForm" novalidate>
                <!-- メールアドレス -->
                <div class="input-group">
                    <label for="email">メールアドレス</label>
                    <input
                        type="email"
                        id="email"
                        name="emailId"
                        autocomplete="email"
                        inputmode="email"
                        placeholder="example@mail.com"
                        aria-describedby="signupError"
                        required
                    >
                </div>

                <!-- パスワード -->
                <div class="input-group">
                    <label for="password">パスワード（8文字以上）</label>
                    <input
                        type="password"
                        id="password"
                        name="txtPass"
                        autocomplete="new-password"
                        placeholder="8文字以上で入力"
                        aria-describedby="signupError"
                        required
                    >
                </div>

                <!-- パスワード確認 -->
                <div class="input-group">
                    <label for="password_confirm">パスワード（確認）</label>
                    <input
                        type="password"
                        id="password_confirm"
                        name="txtPassConfirm"
                        autocomplete="new-password"
                        placeholder="もう一度入力"
                        aria-describedby="signupError"
                        required
                    >
                </div>

                <!-- 登録（主ボタン） -->
                <button type="submit" class="button">登録する</button>
                <p id="signupError" class="field-error" role="alert"></p>
            </form>

            <!-- ログインへ戻る -->
            <div class="login">
                すでにアカウントをお持ちの方は
                <a href="login.html">ログイン</a>
            </div>
        </div>
    </main>

    <script src="../static/auth.js"></script>
</body>
</html>
