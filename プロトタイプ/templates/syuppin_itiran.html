<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../static/syuppin.css">
<title>出品一覧</title>
</head>
<body>
  <div class="site">
    <div class="header">
      <div class="header-inner">
        <a class="back-btn" href="top-index.html" title="戻る">←</a>
        <div class="header-title">出品一覧</div>
        <a class="add-btn" href="syuppin.html">＋出品</a>
      </div>
    </div>

    <div class="page">
      <div class="tabs">
        <button class="tab active" type="button" data-status="販売中" aria-pressed="true">販売中</button>
        <button class="tab" type="button" data-status="売却済み" aria-pressed="false">売却済み</button>
        <button class="tab" type="button" data-status="下書き" aria-pressed="false">下書き</button>
      </div>

      <div class="list" id="listingList" aria-live="polite"></div>
    </div>
  </div>

  <script src="../static/syuppin.js"></script>
  <script>
    document.querySelectorAll('.tab').forEach(function (t) {
      t.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
        t.classList.add('active');
      });
    });
  </script>
</body>
</html>
