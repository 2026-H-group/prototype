<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせフォーム | Re:Tailor</title>
    <link rel="stylesheet" href="../static/support.css">
</head>
<body>
    <div class="support-shell">
        <header class="support-header">
            <a class="support-back" href="help.html" aria-label="ヘルプへ戻る">←</a>
            <a class="support-brand" href="top-index.html">Re:Tailor</a>
            <span class="header-space" aria-hidden="true"></span>
        </header>

        <main class="support-content">
            <p class="support-eyebrow">CONTACT</p>
            <h1>お問い合わせフォーム</h1>
            <p class="support-lead">必要事項をご入力ください。内容を確認のうえ、送信してください。</p>

            <form class="contact-form" id="contactForm">
                <div class="form-field">
                    <label for="contactName">お名前 <span class="required">必須</span></label>
                    <input id="contactName" name="name" type="text" autocomplete="name" required>
                </div>

                <div class="form-field">
                    <label for="contactEmail">メールアドレス <span class="required">必須</span></label>
                    <input id="contactEmail" name="email" type="email" autocomplete="email" required>
                </div>

                <div class="form-field">
                    <label for="contactCategory">お問い合わせ種別 <span class="required">必須</span></label>
                    <select id="contactCategory" name="category" required>
                        <option value="" selected disabled>選択してください</option>
                        <option value="会員登録・ログイン">会員登録・ログイン</option>
                        <option value="商品・出品">商品・出品</option>
                        <option value="購入・支払い">購入・支払い</option>
                        <option value="配送・キャンセル">配送・キャンセル</option>
                        <option value="その他">その他</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="contactReference">注文番号・商品コード <span class="optional">任意</span></label>
                    <input id="contactReference" name="reference" type="text" autocomplete="off">
                </div>

                <div class="form-field">
                    <label for="contactMessage">お問い合わせ内容 <span class="required">必須</span></label>
                    <textarea id="contactMessage" name="message" rows="7" required></textarea>
                </div>

                <p class="form-note">プロトタイプのため、内容は送信されず、このブラウザー内にのみ仮保存されます。</p>
                <button class="support-button support-button-primary submit-button" type="submit">送信する</button>
            </form>
        </main>
    </div>
    <script src="../static/contact.js"></script>
</body>
</html>
